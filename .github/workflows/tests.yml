name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Correr os testes
        run: pytest -v